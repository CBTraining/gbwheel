    /* Offline-first Inlined Tailwind Preflight & Utility Rules */
    *, ::before, ::after {
      box-sizing: border-box;
      border-width: 0;
      border-style: solid;
      border-color: #222222;
    }
    html {
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
      tab-size: 4;
      font-family: 'Google Sans', sans-serif;
    }
    h1, h2, p {
      margin: 0;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    button, input {
      font-family: inherit;
      font-size: 100%;
      font-weight: inherit;
      line-height: inherit;
      color: inherit;
      margin: 0;
      padding: 0;
    }
    button {
      text-transform: none;
      background-color: transparent;
      background-image: none;
      cursor: pointer;
    }
    button:disabled {
      cursor: not-allowed;
    }
    svg {
      display: block;
      vertical-align: middle;
    }

    /* Layout & Positioning */
    .fixed { position: fixed; }
    .relative { position: relative; }
    .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
    .top-4 { top: 1rem; }
    .right-4 { right: 1rem; }
    .z-50 { z-index: 50; }
    .block { display: block; }
    .flex { display: flex; }
    .hidden { display: none !important; }
    .flex-col { flex-direction: column; }
    .flex-wrap { flex-wrap: wrap; }
    .flex-1 { flex: 1 1 0%; }
    .flex-grow { flex-grow: 1; }
    .flex-shrink-0 { flex-shrink: 0; }
    .items-center { align-items: center; }
    .items-stretch { align-items: stretch; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .gap-1\.5 { gap: 0.375rem; }
    .gap-2 { gap: 0.5rem; }
    .space-y-2 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.5rem; }
    .space-x-1 > :not([hidden]) ~ :not([hidden]) { margin-left: 0.25rem; }

    /* Sizing */
    .h-5 { height: 1.25rem; }
    .w-5 { width: 1.25rem; }
    .h-6 { height: 1.5rem; }
    .w-6 { width: 1.5rem; }
    .w-7 { width: 1.75rem; }
    .h-8 { height: 2rem; }
    .w-10 { width: 2.5rem; }
    .w-12 { width: 3rem; }
    .w-16 { width: 4rem; }
    .h-auto { height: auto; }
    .h-full { height: 100%; }
    .h-screen { height: 100vh; height: 100dvh; }
    .w-full { width: 100%; }
    .min-w-0 { min-width: 0px; }
    .max-w-sm { max-width: 24rem; }
    .max-w-\[240px\] { max-width: 240px; }

    /* Spacing */
    .p-1 { padding: 0.25rem; }
    .p-2 { padding: 0.5rem; }

    .p-3\.5 { padding: 0.875rem; }
    .p-4 { padding: 1rem; }

    /* Overflow & Text Wrapping */
    .overflow-hidden { overflow: hidden; }
    .overflow-y-auto { overflow-y: auto; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .break-words { overflow-wrap: break-word; }
    .select-none { -webkit-user-select: none; user-select: none; }

    /* Typography */
    .text-center { text-align: center; }
    .text-xs { font-size: 0.75rem; line-height: 1rem; }
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .text-lg { font-size: 1.125rem; line-height: 1.75rem; }

    .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
    .font-medium { font-weight: 500; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }
    .tracking-tight { letter-spacing: -0.025em; }
    .tabular-nums { font-variant-numeric: tabular-nums; }

    /* Colors & Backgrounds */
    .fill-current { fill: currentColor; }

    .text-neutral-300 { color: #d4d4d4; }

    .border { border-width: 1px; }

    .border-l { border-left-width: 1px; }
    .border-t { border-top-width: 1px; }

    .rounded-lg { border-radius: 0.5rem; }
    .rounded-xl { border-radius: 0.75rem; }
    .rounded-2xl { border-radius: 1rem; }

    /* Shadows, Opacity, Cursors & Transitions */
    .shadow-sm { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
    .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -4px rgba(0, 0, 0, 0.4); }
    .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65); }
    .opacity-50 { opacity: 0.5; }
    .cursor-pointer { cursor: pointer; }
    .cursor-not-allowed { cursor: not-allowed; }
    .transform { transform: translateZ(0); }
    .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
    .transition-colors { transition-property: color, background-color, border-color, fill, stroke; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
    .duration-150 { transition-duration: 150ms; }
    .ease-in-out { transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }

    /* Base typography and subtle blue radial gradient background */
    body {
      font-family: 'Google Sans', sans-serif;
      overscroll-behavior: none;
      background-color: #000000;
      background-image: radial-gradient(
        ellipse 70% 55% at 50% 100%,
        #233e5b 0%,
        #1b3047 20%,
        #132131 40%,
        #0b141d 60%,
        #05090e 78%,
        #000000 100%
      );
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #FFFFFF;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
    }

    /* Cross-browser pure neutral custom scrollbars (no blue tint) */
    #itemListContainer,
    #menuPanel {
      scrollbar-width: thin;
      scrollbar-color: #2e2e2e #000000;
    }

    #itemListContainer::-webkit-scrollbar,
    #menuPanel::-webkit-scrollbar {
      width: 8px;
    }

    #itemListContainer::-webkit-scrollbar-track,
    #menuPanel::-webkit-scrollbar-track {
      background: #000000;
      border-radius: 10px;
    }

    #itemListContainer::-webkit-scrollbar-thumb,
    #menuPanel::-webkit-scrollbar-thumb {
      background: #2e2e2e;
      border-radius: 10px;
    }

    #itemListContainer::-webkit-scrollbar-thumb:hover,
    #menuPanel::-webkit-scrollbar-thumb:hover {
      background: #454545;
    }

    /* Main layout container */
    main {
      position: relative;
    }

    /* Wheel display area */
    .wheel-display-area {
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    /* Canvas styling */
    #wheelCanvas {
      position: absolute;
      overflow: visible;
    }

    /* Wheel pointer (Triangle pointing LEFT towards the wheel's 3 o'clock edge) */
    .wheel-pointer {
      width: 0;
      height: 0;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      border-right: 28px solid #FFFFFF;
      border-left: 0;
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      z-index: 10;
      pointer-events: none;
      filter: drop-shadow(-2px 0 4px rgba(0, 0, 0, 0.9));
    }

    /* Responsive styling */
    @media (max-width: 767px) {
      .wheel-pointer {
        border-top-width: 12px;
        border-bottom-width: 12px;
        border-right-width: 22px;
      }
    }

    /* Popup transitions */
    .popup-enter {
      opacity: 0;
      transform: scale(0.9);
    }

    .popup-enter-active {
      opacity: 1;
      transform: scale(1);
      transition: opacity 300ms cubic-bezier(0.16, 1, 0.3, 1), transform 300ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .popup-leave-active {
      opacity: 0;
      transform: scale(0.9);
      transition: opacity 300ms cubic-bezier(0.16, 1, 0.3, 1), transform 300ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Confetti canvas */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 60;
    }

    /* Menu panel & pitch black overlay */
    #menuPanel {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: 320px;
      max-width: 85vw;
      background-color: #000000;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
      box-shadow: -6px 0 25px rgba(0, 0, 0, 0.85);
    }

    #menuPanel.open {
      transform: translateX(0);
    }

    #menuOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.75);
      z-index: 49;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      pointer-events: none;
    }

    #menuOverlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Input with icon button */
    .input-with-button-container {
      position: relative;
    }

    #newItemName {
      padding-right: 42px;
    }

    #addNewItemSymbolButton {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      padding-left: 0.75rem;
      padding-right: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: transparent;
      border: none;
      cursor: pointer;
    }

    /* Clean number input without native spin arrows */
    .qty-input::-webkit-outer-spin-button,
    .qty-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .qty-input {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    #addNewItemSymbolButton svg {
      transition: color 0.15s ease-in-out, transform 0.15s ease-in-out;
    }

    #addNewItemSymbolButton:hover svg {
      color: #FFFFFF;
      transform: scale(1.1);
    }

    /* Animated gradient border wrapper for win popup */
    @keyframes gradientCycle {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .gradient-background-animated {
      background: linear-gradient(135deg, #4b83f0, #d86673, #fbbc04, #34a853, #4b83f0);
      background-size: 300% 300%;
      animation: gradientCycle 4s linear infinite;
      padding: 4px;
    }
  </style>
</head>

              class="flex-1 py-2 px-3 bg-[#0d0d0d] hover:bg-[#171717] border border-[#222222] rounded-lg text-xs font-medium text-neutral-300 hover:text-white transition-colors focus:outline-none focus:ring-1 focus:ring-neutral-400">
        Toggle All
      </button>
      <button type="button"
              id="resetDefaultsButton"
              class="flex-1 py-2 px-3 bg-[#0d0d0d] hover:bg-[#171717] border border-[#222222] rounded-lg text-xs font-medium text-neutral-300 hover:text-white transition-colors focus:outline-none focus:ring-1 focus:ring-neutral-400">
        Reset Defaults
      </button>
    </div>
    <p class="text-xs text-neutral-500 mt-3 text-center">Changes are saved automatically.</p>
  </aside>

  <!-- Win Congratulations Modal Dialog (Pure Neutral Black) -->
  <div id="winPopup" class="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50 hidden popup-enter"
    role="dialog" aria-modal="true" aria-labelledby="winPopupTitle" tabindex="-1">
    <div class="gradient-background-animated rounded-2xl shadow-2xl max-w-sm w-full">
      <div class="bg-[#0d0d0d] p-8 rounded-xl text-center w-full border border-[#222222]">
        <h2 id="winPopupTitle" class="text-2xl font-bold mb-3 text-white">Congratulations!</h2>
        <p class="text-neutral-300 text-lg mb-1">You've won:</p>
        <p id="winningItemText" class="text-3xl font-semibold text-blue-400 mb-1 break-words"></p>
        <p id="winningItemRemainingText" class="text-neutral-400 text-xs mb-6"></p>
        <button type="button"
                        id="closePopupButton"
                        class="py-3 px-6 rounded-full shadow-lg hover:shadow-xl transform active:scale-95 transition-all duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-black w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold focus:ring-blue-400">
                    Spin Again
                </button>
        <button type="button"
                        id="removeWinnerButton"
                        class="mt-2.5 py-2.5 px-6 rounded-full transform active:scale-95 transition-all duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-neutral-400 w-full bg-[#171717] hover:bg-[#222222] border border-[#2e2e2e] text-neutral-300 hover:text-white text-sm font-medium">
                    Remove from Wheel
                </button>
      </div>
    </div>
  </div>

  <script>
    // Use strict mode for better error detection and engine optimizations
        'use strict';

        // --- DOM References ---
        const wheelCanvas = document.getElementById('wheelCanvas');
        const ctx = wheelCanvas.getContext('2d');
        const wheelPointer = document.getElementById('wheelPointer');
        const spinButton = document.getElementById('spinButton');
        const spinCountInput = document.getElementById('spinCountInput');
        const decrementSpinCountButton = document.getElementById('decrementSpinCountButton');
        const incrementSpinCountButton = document.getElementById('incrementSpinCountButton');
        const resetSpinCountButton = document.getElementById('resetSpinCountButton');
        const newItemNameInput = document.getElementById('newItemName');
        const newItemAmountInput = document.getElementById('newItemAmount');
        const addNewItemSymbolButton = document.getElementById('addNewItemSymbolButton');
        const itemInputFeedback = document.getElementById('itemInputFeedback');
        const itemListElement = document.getElementById('itemList');
        const noItemsMessage = document.getElementById('noItemsMessage');
        const noActiveItemsMessage = document.getElementById('noActiveItemsMessage');
        const toggleAllItemsButton = document.getElementById('toggleAllItemsButton');
        const resetDefaultsButton = document.getElementById('resetDefaultsButton');
        const winPopup = document.getElementById('winPopup');
        const winningItemText = document.getElementById('winningItemText');
        const winningItemRemainingText = document.getElementById('winningItemRemainingText');
        const closePopupButton = document.getElementById('closePopupButton');
        const removeWinnerButton = document.getElementById('removeWinnerButton');
        const menuPanel = document.getElementById('menuPanel');
        const menuToggleButton = document.getElementById('menuToggleButton');
        const closeMenuButton = document.getElementById('closeMenuButton');
        const menuOverlay = document.getElementById('menuOverlay');
        const confettiCanvas = document.getElementById('confettiCanvas');
        const confettiCtx = confettiCanvas.getContext('2d');

        // --- State Variables ---
        let items = [];
        let spinCount = 0;
        let currentRotation = 0;
        let isSpinning = false;
        let isPopupClosing = false;
        let spinSessionItems = null;
        let menuOpen = false;
        let currentlyEditingItemId = null;
        let lastWinningItemId = null;
        let feedbackTimeoutId = null;

        // --- Cached Canvas Layout State ---
        let cachedCanvasLayout = {
            containerWidth: 0,
            containerHeight: 0,
            dpr: 0,
            radius: 0,
            logicalSize: 0
        };

        // --- Confetti State ---
        let confettiParticles = [];
        let confettiAnimationId = null;
        let continuousConfettiActive = true; // Continuous light celebration rain
        let confettiBurstActive = false;      // Win explosion burst

        // --- Win Pop-Out State ---
        let winningSegmentIndex = -1;
        let popOutProgress = 0; // 0 = no pop out, 1 = full pop out
        let popOutAnimationId = null;

        // --- Constants ---
        const googleColors = ['#4285F4', '#EA4335', '#FBBC04', '#34A853']; // Base colors for wheel
        const googleColorsFull = ['#4385f5', '#dc4438', '#f5b401', '#109d59', '#77a7fb', '#e57368', '#fbcb43', '#34b67a']; // Colors for confetti
        const STORAGE_KEY = 'gameshowWheelItems';
        const SPIN_COUNT_STORAGE_KEY = 'gameshowWheelSpinCount';
        const MAX_SPIN_COUNT = 999999;
        const DEFAULT_ITEM_AMOUNT = 5;
        const POP_OUT_OFFSET = 12; 
        const POP_OUT_DURATION = 300; 
        const POPUP_DELAY = 450; 
        const SPIN_DURATION = 5000;

        // --- Spin Count Management ---
        function normalizeSpinCount(value) {
            const parsed = Math.floor(Number(value));
            if (!Number.isFinite(parsed)) return 0;
            return Math.max(0, Math.min(MAX_SPIN_COUNT, parsed));
        }

        function renderSpinCount() {
            if (spinCountInput) {
                spinCountInput.value = String(spinCount);
            }
            const isZero = spinCount <= 0;
            const isMax = spinCount >= MAX_SPIN_COUNT;
            if (decrementSpinCountButton) {
                decrementSpinCountButton.disabled = isZero;
                decrementSpinCountButton.classList.toggle('opacity-50', isZero);
            }
            if (incrementSpinCountButton) {
                incrementSpinCountButton.disabled = isMax;
                incrementSpinCountButton.classList.toggle('opacity-50', isMax);
            }
            if (resetSpinCountButton) {
                resetSpinCountButton.disabled = isZero;
                resetSpinCountButton.classList.toggle('opacity-50', isZero);
            }
        }

        function saveSpinCount() {
            spinCount = normalizeSpinCount(spinCount);
            try {
                localStorage.setItem(SPIN_COUNT_STORAGE_KEY, String(spinCount));
            } catch (e) {
                console.error("Error saving spin count to localStorage:", e);
            }
            renderSpinCount();
        }

        function loadSpinCount() {
            try {
                const storedCount = localStorage.getItem(SPIN_COUNT_STORAGE_KEY);
                spinCount = storedCount !== null ? normalizeSpinCount(storedCount) : 0;
            } catch (e) {
                console.error("Error loading spin count from localStorage:", e);
                spinCount = 0;
            }
            renderSpinCount();
        }

        if (decrementSpinCountButton) {
            decrementSpinCountButton.addEventListener('click', () => {
                if (spinCount <= 0) return;
                spinCount = Math.max(0, spinCount - 1);
                saveSpinCount();
            });
        }

        if (incrementSpinCountButton) {
            incrementSpinCountButton.addEventListener('click', () => {
                if (spinCount >= MAX_SPIN_COUNT) return;
                spinCount = Math.min(MAX_SPIN_COUNT, spinCount + 1);
                saveSpinCount();
            });
        }

        if (resetSpinCountButton) {
            resetSpinCountButton.addEventListener('click', () => {
                if (spinCount === 0) return;
                spinCount = 0;
                saveSpinCount();
            });
        }

        if (spinCountInput) {
            spinCountInput.addEventListener('change', () => {
                spinCount = normalizeSpinCount(spinCountInput.value);
                saveSpinCount();
            });
            spinCountInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    spinCountInput.blur();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    e.stopPropagation();
                    spinCountInput.value = String(spinCount);
                    spinCountInput.blur();
                }
            });
        }

        // --- Text Layout Cache ---
        // Caches wrapped text measurements to prevent recalculations on every animation frame
        const textWrapCache = new Map();

        function clearTextWrapCache() {
            textWrapCache.clear();
        }

        function invalidateWheelLayout() {
            cachedCanvasLayout.containerWidth = 0;
            cachedCanvasLayout.containerHeight = 0;
            cachedCanvasLayout.dpr = 0;
        }

        // --- Item Management ---
        function normalizeItem(item, index) {
            if (!item || typeof item !== 'object') return null;
            const name = typeof item.name === 'string' ? item.name.trim() : '';
            if (!name) return null;
            const rawAmount = Number(item.amount);
            const amount = Number.isFinite(rawAmount)
                ? Math.max(0, Math.min(999, Math.floor(rawAmount)))
                : DEFAULT_ITEM_AMOUNT;
            const active = amount > 0
                ? (typeof item.active === 'boolean' ? item.active : true)
                : false;
            return {
                id: (item.id !== undefined && item.id !== null && String(item.id).trim() !== '')
                    ? String(item.id)
                    : `${Date.now()}_${index}`,
                name: name.slice(0, 60),
                active,
                amount
            };
        }

        function loadItems() {
            let loadedFromStorage = false;
            try {
                const storedItems = localStorage.getItem(STORAGE_KEY);
                if (storedItems !== null) {
                    const parsed = JSON.parse(storedItems);
                    if (Array.isArray(parsed)) {
                        const normalized = parsed.map(normalizeItem).filter(Boolean);
                        // Accept the stored list if it was intentionally emptied or has valid items
                        if (parsed.length === 0 || normalized.length > 0) {
                            items = normalized;
                            loadedFromStorage = true;
                        }
                    }
                }
            } catch (e) {
                console.error("Error loading items from localStorage:", e);
            }

            if (!loadedFromStorage) {
                items = getDefaultItems();
            }

            // Ensure all item IDs are unique
            const uniqueIds = new Set();
            items = items.map((item, idx) => {
                let id = item.id;
                while (uniqueIds.has(id)) {
                    id = `${Date.now()}_${idx}_${Math.random().toString(36).slice(2, 7)}`;
                }
                uniqueIds.add(id);
                return { ...item, id };
            });

            saveItems(false);
            renderItemsList();
            requestAnimationFrame(drawWheel);
            checkActiveItems();
        }

        function getDefaultItems() {
            const timestamp = Date.now();
            return [
                { id: timestamp + '_1', name: 'Bag', active: true, amount: DEFAULT_ITEM_AMOUNT },
                { id: timestamp + '_2', name: 'Shirt', active: true, amount: DEFAULT_ITEM_AMOUNT },
                { id: timestamp + '_3', name: 'Gemini Tumbler', active: true, amount: DEFAULT_ITEM_AMOUNT },
                { id: timestamp + '_4', name: 'Socks', active: true, amount: DEFAULT_ITEM_AMOUNT },
                { id: timestamp + '_5', name: 'Hat', active: true, amount: DEFAULT_ITEM_AMOUNT },
                { id: timestamp + '_6', name: 'Lanyard', active: true, amount: DEFAULT_ITEM_AMOUNT },
                { id: timestamp + '_7', name: 'Pen', active: true, amount: DEFAULT_ITEM_AMOUNT }
            ];
        }

        function saveItems(updateDOMList = true) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
            } catch (e) {
                console.error("Error saving items to localStorage:", e);
            }
            clearTextWrapCache();
            if (updateDOMList) {
                renderItemsList();
            }
            drawWheel();
            checkActiveItems();
        }

        function renderItemsList() {
            itemListElement.replaceChildren();
            noItemsMessage.classList.toggle('hidden', items.length > 0);

            items.forEach(item => {
                const listItem = document.createElement('li');
                // Pure neutral dark charcoal, zero blue tint
                listItem.className = 'flex items-center justify-between p-2.5 bg-[#0d0d0d] hover:bg-[#171717] rounded-lg transition-colors border border-[#222222]';
                listItem.dataset.itemId = item.id;

                const itemInfo = document.createElement('div');
                itemInfo.className = 'flex items-center flex-grow mr-2 min-w-0';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = item.active && item.amount > 0;
                checkbox.setAttribute('aria-label', `Toggle active state for ${item.name}`);
                checkbox.className = 'h-5 w-5 rounded cursor-pointer flex-shrink-0 accent-blue-600 mr-3';
                checkbox.addEventListener('change', () => {
                    if (checkbox.checked && item.amount <= 0) {
                        item.amount = 1;
                    }
                    item.active = checkbox.checked;
                    saveItems(true);
                });
                itemInfo.appendChild(checkbox);

                if (currentlyEditingItemId === item.id) {
                    const inputField = document.createElement('input');
                    inputField.type = 'text';
                    inputField.value = item.name;
                    inputField.maxLength = 60;
                    inputField.setAttribute('aria-label', `Edit name for ${item.name}`);
                    inputField.className = 'text-white bg-[#1a1a1a] p-1 px-2 border border-[#444444] rounded-md flex-grow min-w-0 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-400';

                    inputField.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            handleSaveEdit(item.id, inputField.value);
                        } else if (e.key === 'Escape') {
                            e.preventDefault();
                            currentlyEditingItemId = null;
                            renderItemsList();
                        }
                    });

                    inputField.addEventListener('blur', (e) => {
                        if (!e.relatedTarget || !e.relatedTarget.closest('.edit-controls')) {
                            handleSaveEdit(item.id, inputField.value);
                        }
                    });

                    itemInfo.appendChild(inputField);
                    setTimeout(() => inputField.focus(), 0);
                } else {
                    const itemNameSpan = document.createElement('span');
                    itemNameSpan.textContent = item.name;
                    itemNameSpan.className = `truncate cursor-pointer font-medium text-sm ${item.amount > 0 ? 'text-white hover:text-neutral-300' : 'text-neutral-500'}`;
                    itemNameSpan.title = `Click to edit: ${item.name}`;
                    itemNameSpan.tabIndex = 0;
                    itemNameSpan.setAttribute('role', 'button');
                    itemNameSpan.setAttribute('aria-label', `Click to edit item ${item.name}`);

                    const startEdit = () => {
                        currentlyEditingItemId = item.id;
                        renderItemsList();
                    };

                    itemNameSpan.addEventListener('click', startEdit);
                    itemNameSpan.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            startEdit();
                        }
                    });
                    itemInfo.appendChild(itemNameSpan);
                }
                listItem.appendChild(itemInfo);

                const actionButtons = document.createElement('div');
                actionButtons.className = 'flex items-center space-x-1 flex-shrink-0 edit-controls';

                if (currentlyEditingItemId === item.id) {
                    const saveButton = document.createElement('button');
                    saveButton.type = 'button';
                    saveButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-green-400 hover:text-green-300" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>`;
                    saveButton.className = 'p-1 rounded-md hover:bg-[#222222] transition-colors focus:outline-none focus:ring-1 focus:ring-green-400';
                    saveButton.title = 'Save';
                    saveButton.setAttribute('aria-label', 'Save item edit');
                    saveButton.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const inputField = listItem.querySelector('input[type="text"]');
                        if (inputField) handleSaveEdit(item.id, inputField.value);
                    });
                    actionButtons.appendChild(saveButton);

                    const cancelButton = document.createElement('button');
                    cancelButton.type = 'button';
                    cancelButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-neutral-400 hover:text-white" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>`;
                    cancelButton.className = 'p-1 rounded-md hover:bg-[#222222] transition-colors focus:outline-none focus:ring-1 focus:ring-neutral-400';
                    cancelButton.title = 'Cancel';
                    cancelButton.setAttribute('aria-label', 'Cancel item edit');
                    cancelButton.addEventListener('click', (e) => {
                        e.stopPropagation();
                        currentlyEditingItemId = null;
                        renderItemsList();
                    });
                    actionButtons.appendChild(cancelButton);
                } else {
                    // Compact customizable amount stepper (- [amount] +)
                    const qtyWrapper = document.createElement('div');
                    qtyWrapper.className = 'flex items-center bg-[#171717] border border-[#2e2e2e] rounded-md mr-2';

                    const decBtn = document.createElement('button');
                    decBtn.type = 'button';
                    decBtn.textContent = '−';
                    decBtn.className = 'px-1.5 py-0.5 text-xs font-bold text-neutral-400 hover:text-white hover:bg-[#222222] rounded-md transition-colors focus:outline-none';
                    decBtn.title = 'Decrease amount';
                    decBtn.setAttribute('aria-label', `Decrease amount for ${item.name}`);
                    decBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        item.amount = Math.max(0, (item.amount || 0) - 1);
                        if (item.amount === 0) {
                            item.active = false;
                        }
                        saveItems(true);
                    });

                    const qtyInput = document.createElement('input');
                    qtyInput.type = 'number';
                    qtyInput.min = '0';
                    qtyInput.max = '999';
                    qtyInput.value = String(item.amount ?? DEFAULT_ITEM_AMOUNT);
                    qtyInput.setAttribute('aria-label', `Amount for ${item.name}`);
                    qtyInput.className = `qty-input w-10 bg-[#171717] text-center text-xs font-semibold py-0.5 focus:outline-none focus:ring-1 focus:ring-neutral-400 rounded ${item.amount > 0 ? 'text-white' : 'text-red-400'}`;
                    const commitQty = () => {
                        const parsed = Math.floor(Number(qtyInput.value));
                        const nextAmount = Number.isFinite(parsed) ? Math.max(0, Math.min(999, parsed)) : 0;
                        const wasZero = item.amount === 0;
                        item.amount = nextAmount;
                        if (nextAmount === 0) {
                            item.active = false;
                        } else if (wasZero) {
                            item.active = true;
                        }
                        saveItems(true);
                    };
                    qtyInput.addEventListener('change', commitQty);
                    qtyInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            qtyInput.blur();
                        }
                    });

                    const incBtn = document.createElement('button');
                    incBtn.type = 'button';
                    incBtn.textContent = '+';
                    incBtn.className = 'px-1.5 py-0.5 text-xs font-bold text-neutral-400 hover:text-white hover:bg-[#222222] rounded-md transition-colors focus:outline-none';
                    incBtn.title = 'Increase amount';
                    incBtn.setAttribute('aria-label', `Increase amount for ${item.name}`);
                    incBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const wasZero = item.amount === 0;
                        item.amount = Math.min(999, (item.amount || 0) + 1);
                        if (wasZero && item.amount > 0) {
                            item.active = true;
                        }
                        saveItems(true);
                    });

                    qtyWrapper.appendChild(decBtn);
                    qtyWrapper.appendChild(qtyInput);
                    qtyWrapper.appendChild(incBtn);
                    actionButtons.appendChild(qtyWrapper);

                    const editButton = document.createElement('button');
                    editButton.type = 'button';
                    editButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-5 h-5 text-neutral-400 hover:text-white" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" /></svg>`;
                    editButton.className = 'p-1 rounded-md hover:bg-[#222222] transition-colors focus:outline-none focus:ring-1 focus:ring-neutral-400';
                    editButton.title = 'Edit';
                    editButton.setAttribute('aria-label', `Edit item ${item.name}`);
                    editButton.addEventListener('click', (e) => {
                        e.stopPropagation();
                        currentlyEditingItemId = item.id;
                        renderItemsList();
                    });
                    actionButtons.appendChild(editButton);

                    const deleteButton = document.createElement('button');
                    deleteButton.type = 'button';
                    deleteButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-5 h-5 text-red-400 hover:text-red-300" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>`;
                    deleteButton.className = 'p-1 rounded-md hover:bg-[#222222] transition-colors focus:outline-none focus:ring-1 focus:ring-red-400';
                    deleteButton.title = 'Delete';
                    deleteButton.setAttribute('aria-label', `Delete item ${item.name}`);
                    deleteButton.addEventListener('click', (e) => {
                        e.stopPropagation();
                        items = items.filter(i => i.id !== item.id);
                        if (currentlyEditingItemId === item.id) {
                            currentlyEditingItemId = null;
                        }
                        saveItems(true);
                    });
                    actionButtons.appendChild(deleteButton);
                }
                listItem.appendChild(actionButtons);
                itemListElement.appendChild(listItem);
            });
        }

        function handleSaveEdit(itemId, newName) {
            if (currentlyEditingItemId !== itemId) return;
            const trimmedName = (newName || '').trim();
            const itemToEdit = items.find(i => i.id === itemId);

            if (itemToEdit && trimmedName) {
                const duplicate = items.find(
                    i => i.id !== itemId && i.name.toLowerCase() === trimmedName.toLowerCase()
                );
                if (duplicate) {
                    showInputFeedback(`"${duplicate.name}" is already in the list.`, true);
                } else {
                    itemToEdit.name = trimmedName;
                }
            }
            currentlyEditingItemId = null;
            saveItems(true);
        }

        function showInputFeedback(message, isError = false) {
            if (!itemInputFeedback) return;
            clearTimeout(feedbackTimeoutId);
            itemInputFeedback.textContent = message;
            itemInputFeedback.className = `text-xs mt-2 ${isError ? 'text-red-400' : 'text-neutral-300'}`;
            feedbackTimeoutId = setTimeout(() => {
                itemInputFeedback.classList.add('hidden');
            }, 2200);
        }

        function triggerAddItem() {
            const name = newItemNameInput.value.trim();
            if (!name) return;

            const parsedQty = Math.floor(Number(newItemAmountInput ? newItemAmountInput.value : DEFAULT_ITEM_AMOUNT));
            const amountToAdd = Number.isFinite(parsedQty) && parsedQty > 0 ? Math.min(999, parsedQty) : DEFAULT_ITEM_AMOUNT;

            const existingItem = items.find(item => item.name.toLowerCase() === name.toLowerCase());
            if (!existingItem) {
                const newId = Date.now().toString() + '_' + Math.random().toString(36).slice(2, 7);
                items.push({ id: newId, name: name, active: true, amount: amountToAdd });
                newItemNameInput.value = '';
                if (itemInputFeedback) itemInputFeedback.classList.add('hidden');
                saveItems(true);
                const listContainer = document.getElementById('itemListContainer');
                listContainer.scrollTop = listContainer.scrollHeight;
            } else {
                existingItem.amount = Math.min(999, (existingItem.amount || 0) + amountToAdd);
                existingItem.active = true;
                newItemNameInput.value = '';
                saveItems(true);
                showInputFeedback(`Added +${amountToAdd} to "${existingItem.name}" (total: ${existingItem.amount}).`, false);
            }
        }

        addNewItemSymbolButton.addEventListener('click', triggerAddItem);
        newItemNameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                triggerAddItem();
            }
        });
        if (newItemAmountInput) {
            newItemAmountInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    triggerAddItem();
                }
            });
        }

        toggleAllItemsButton.addEventListener('click', () => {
            if (items.length === 0) return;
            const shouldActivateAll = items.some(item => !item.active || item.amount <= 0);
            items.forEach(item => {
                if (shouldActivateAll && item.amount <= 0) {
                    item.amount = 1;
                }
                item.active = shouldActivateAll;
            });
            saveItems(true);
        });

        resetDefaultsButton.addEventListener('click', () => {
            currentlyEditingItemId = null;
            items = getDefaultItems();
            saveItems(true);
            showInputFeedback('Restored default items.', false);
        });

        // --- Efficient Text Wrapping & Canvas Rendering ---
        function getWrappedLines(context, text, maxWidth, maxLines = 2) {
            const cacheKey = `${text}|${maxWidth}|${maxLines}|${context.font}`;
            if (textWrapCache.has(cacheKey)) {
                return textWrapCache.get(cacheKey);
            }

            const words = text.split(/\s+/);
            const lines = [];
            let currentLine = words[0] || '';

            for (let i = 1; i < words.length; i++) {
                const word = words[i];
                const testLine = currentLine + ' ' + word;
                if (context.measureText(testLine).width <= maxWidth || currentLine === '') {
                    currentLine = testLine;
                } else {
                    lines.push(currentLine);
                    currentLine = word;
                }
            }
            if (currentLine) {
                lines.push(currentLine);
            }

            // Truncate overly long lines with ellipsis
            for (let i = 0; i < lines.length; i++) {
                if (context.measureText(lines[i]).width > maxWidth) {
                    let truncated = lines[i];
                    while (truncated.length > 0 && context.measureText(truncated + '...').width > maxWidth) {
                        truncated = truncated.slice(0, -1);
                    }
                    lines[i] = truncated + '...';
                }
            }

            // Cap to maxLines and add ellipsis to the last line if more lines exist
            let finalLines = lines;
            if (lines.length > maxLines) {
                let lastLine = lines[maxLines - 1];
                while (lastLine.length > 0 && context.measureText(lastLine + '...').width > maxWidth) {
                    lastLine = lastLine.slice(0, -1);
                }
                finalLines = lines.slice(0, maxLines - 1);
                finalLines.push(lastLine + '...');
            }

            textWrapCache.set(cacheKey, finalLines);
            return finalLines;
        }

        function renderWrappedText(context, text, x, y, maxWidth, lineHeight, maxLines = 2) {
            const lines = getWrappedLines(context, text, maxWidth, maxLines);
            const totalTextHeight = lines.length * lineHeight;
            const startY = y - (totalTextHeight / 2) + (lineHeight / 2);

            context.textBaseline = 'middle';
            for (let i = 0; i < lines.length; i++) {
                context.fillText(lines[i], x, startY + (i * lineHeight));
            }
        }

        // --- Wheel Drawing ---
        function getWheelItems() {
            return (isSpinning && spinSessionItems)
                ? spinSessionItems
                : items.filter(item => item.active && item.amount > 0);
        }

        function drawWheel() {
            const activeItems = getWheelItems();
            const numSegments = activeItems.length;
            const container = wheelCanvas.parentElement;

            if (!container) return;
            const containerWidth = container.offsetWidth;
            const containerHeight = container.offsetHeight;

            if (!containerWidth || !containerHeight) {
                requestAnimationFrame(drawWheel);
                return;
            }

            const dpr = window.devicePixelRatio || 1;
            const radius = Math.min(containerHeight / 2, Math.max(80, containerWidth - 32));
            const logicalSize = radius * 2 + POP_OUT_OFFSET * 2;

            // Only re-allocate canvas backing store & update DOM styles when dimensions or DPR change
            if (
                cachedCanvasLayout.containerWidth !== containerWidth ||
                cachedCanvasLayout.containerHeight !== containerHeight ||
                cachedCanvasLayout.dpr !== dpr
            ) {
                cachedCanvasLayout.containerWidth = containerWidth;
                cachedCanvasLayout.containerHeight = containerHeight;
                cachedCanvasLayout.dpr = dpr;
                cachedCanvasLayout.radius = radius;
                cachedCanvasLayout.logicalSize = logicalSize;

                wheelCanvas.width = Math.floor(logicalSize * dpr);
                wheelCanvas.height = Math.floor(logicalSize * dpr);
                wheelCanvas.style.width = logicalSize + 'px';
                wheelCanvas.style.height = logicalSize + 'px';

                wheelCanvas.style.left = (-radius - POP_OUT_OFFSET) + 'px';
                wheelCanvas.style.top = (containerHeight / 2 - radius - POP_OUT_OFFSET) + 'px';

                if (wheelPointer) {
                    wheelPointer.style.left = `${radius}px`;
                    wheelPointer.style.top = `${containerHeight / 2}px`;
                }
            }

            const canvasCenterX = radius + POP_OUT_OFFSET;
            const canvasCenterY = radius + POP_OUT_OFFSET;

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, logicalSize, logicalSize);

            if (numSegments === 0) {
                if (!isSpinning) checkActiveItems();
                ctx.fillStyle = '#FFFFFF';
                ctx.textAlign = 'center';
                ctx.font = "500 16px 'Google Sans', sans-serif";
                ctx.fillText('Add items to spin!', canvasCenterX, canvasCenterY);
                return;
            }

            const anglePerSegment = (2 * Math.PI) / numSegments;
            let previousColorIndex = -1;

            // Draw segment slices
            activeItems.forEach((item, index) => {
                const startAngle = index * anglePerSegment;
                const endAngle = (index + 1) * anglePerSegment;

                let colorIndex;
                if (googleColors.length === 0) {
                    colorIndex = 0;
                } else if (googleColors.length === 1 || numSegments === 1) {
                    colorIndex = 0;
                } else {
                    colorIndex = index % googleColors.length;
                    if (colorIndex === previousColorIndex) {
                        colorIndex = (colorIndex + 1) % googleColors.length;
                    }
                    // Prevent the last segment from sharing color with the first segment
                    if (numSegments > 1 && index === numSegments - 1 && colorIndex === 0) {
                        colorIndex = (colorIndex + 1) % googleColors.length;
                    }
                }
                previousColorIndex = colorIndex;

                ctx.save();
                ctx.translate(canvasCenterX, canvasCenterY);
                ctx.rotate(currentRotation);

                // Winning segment pop-out translation (radial offset along slice direction)
                if (index === winningSegmentIndex && popOutProgress > 0) {
                    const segmentMidAngle = index * anglePerSegment + anglePerSegment / 2;
                    const offsetX = Math.cos(segmentMidAngle) * POP_OUT_OFFSET * popOutProgress;
                    const offsetY = Math.sin(segmentMidAngle) * POP_OUT_OFFSET * popOutProgress;
                    ctx.translate(offsetX, offsetY);
                }

                const sliceColor = googleColors[colorIndex] || '#CCCCCC';
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = sliceColor;
                ctx.fill();
                ctx.strokeStyle = sliceColor;
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.restore();
            });

            // Draw slice labels
            const textFontSize = Math.max(16, Math.min(32, radius * 0.11));
            ctx.font = `bold ${textFontSize}px 'Google Sans', sans-serif`;
            const lineHeight = textFontSize * 1.25;
            const textDist = radius * 0.65;
            const practicalMaxTextWidth = radius * 0.52;
            ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'center';

            activeItems.forEach((item, index) => {
                const segmentMidAngle = index * anglePerSegment + anglePerSegment / 2;
                const actualAngleOnCanvas = currentRotation + segmentMidAngle;

                let textX = canvasCenterX + Math.cos(actualAngleOnCanvas) * textDist;
                let textY = canvasCenterY + Math.sin(actualAngleOnCanvas) * textDist;

                // Accurately translate text in the direction of the rotated slice during pop-out
                if (index === winningSegmentIndex && popOutProgress > 0) {
                    const popOutOffsetX = Math.cos(actualAngleOnCanvas) * POP_OUT_OFFSET * popOutProgress;
                    const popOutOffsetY = Math.sin(actualAngleOnCanvas) * POP_OUT_OFFSET * popOutProgress;
                    textX += popOutOffsetX;
                    textY += popOutOffsetY;
                }

                ctx.save();
                ctx.translate(textX, textY);
                renderWrappedText(ctx, item.name, 0, 0, practicalMaxTextWidth, lineHeight, 2);
                ctx.restore();
            });

            if (!isSpinning) checkActiveItems();
        }

        // --- Wheel Spinning ---
        function setSpinningState(spinning) {
            isSpinning = spinning;
            spinButton.disabled = spinning;
            spinButton.classList.toggle('opacity-50', spinning);
            spinButton.classList.toggle('cursor-not-allowed', spinning);
            spinButton.textContent = spinning ? 'Spinning...' : 'Spin Wheel';
        }

        function spinWheel() {
            if (isSpinning) return;
            const activeItems = items.filter(item => item.active && item.amount > 0);
            if (activeItems.length === 0) {
                noActiveItemsMessage.classList.remove('hidden');
                setTimeout(() => noActiveItemsMessage.classList.add('hidden'), 3000);
                return;
            }

            if (menuOpen) toggleMenu(false);
            spinSessionItems = activeItems.map(item => ({ id: item.id, name: item.name }));
            setSpinningState(true);
            popOutProgress = 0;
            winningSegmentIndex = -1;
            lastWinningItemId = null;
            if (popOutAnimationId) cancelAnimationFrame(popOutAnimationId);

            const randomExtraSpins = Math.floor(Math.random() * 5) + 8;
            const targetSegmentIndex = Math.floor(Math.random() * spinSessionItems.length);
            const anglePerSegment = (2 * Math.PI) / spinSessionItems.length;

            const targetAngleForSegmentMidpoint = (targetSegmentIndex + 0.5) * anglePerSegment;
            let finalTargetRotation = (2 * Math.PI * randomExtraSpins) - targetAngleForSegmentMidpoint;

            const randomAngularOffset = (Math.random() - 0.5) * (anglePerSegment * 0.6);
            finalTargetRotation += randomAngularOffset;

            let startTime = null;
            const initialRotation = currentRotation;

            function animateSpin(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsedTime = timestamp - startTime;
                const progress = Math.min(elapsedTime / SPIN_DURATION, 1);
                // EaseOutQuart curve
                const easedProgress = 1 - Math.pow(1 - progress, 4);

                currentRotation = initialRotation + (finalTargetRotation - initialRotation) * easedProgress;
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    currentRotation = finalTargetRotation % (2 * Math.PI);
                    if (currentRotation < 0) currentRotation += (2 * Math.PI);

                    const normalizedPointerAngle = ((-currentRotation % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI);
                    winningSegmentIndex = Math.floor(normalizedPointerAngle / anglePerSegment);
                    winningSegmentIndex = Math.max(0, Math.min(spinSessionItems.length - 1, winningSegmentIndex));

                    startPopOutAnimation(() => {
                        const sessionWinner = spinSessionItems ? spinSessionItems[winningSegmentIndex] : null;
                        const winningItem = sessionWinner ? items.find(item => item.id === sessionWinner.id) : null;

                        if (winningItem) {
                            spinCount = Math.min(MAX_SPIN_COUNT, spinCount + 1);
                            saveSpinCount();
                            lastWinningItemId = winningItem.id;
                            // Decrement item amount by -1 when won and auto-deactivate at 0
                            const currentAmt = typeof winningItem.amount === 'number' ? winningItem.amount : 1;
                            winningItem.amount = Math.max(0, currentAmt - 1);
                            if (winningItem.amount <= 0) {
                                winningItem.active = false;
                            }
                            try {
                                localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
                            } catch (e) {
                                console.error("Error saving items to localStorage:", e);
                            }
                            renderItemsList();

                            setTimeout(() => {
                                showWinPopup(winningItem);
                            }, POPUP_DELAY);
                        } else if (sessionWinner) {
                            spinCount = Math.min(MAX_SPIN_COUNT, spinCount + 1);
                            saveSpinCount();
                            lastWinningItemId = null;
                            setTimeout(() => {
                                showWinPopup({ name: sessionWinner.name, amount: null });
                            }, POPUP_DELAY);
                        } else {
                            console.error('Error: Could not determine winning item. Index:', winningSegmentIndex);
                            spinSessionItems = null;
                            setSpinningState(false);
                            drawWheel();
                        }
                    });
                }
            }
            requestAnimationFrame(animateSpin);
        }

        spinButton.addEventListener('click', spinWheel);

        // --- Pop-out Animation ---
        function startPopOutAnimation(callback = null) {
            let startTime = null;
            const activeItems = getWheelItems();

            if (winningSegmentIndex < 0 || winningSegmentIndex >= activeItems.length) {
                console.error('Invalid winningSegmentIndex for pop-out animation:', winningSegmentIndex);
                if (callback) callback();
                return;
            }

            function animatePopOut(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsedTime = timestamp - startTime;
                const progress = Math.min(elapsedTime / POP_OUT_DURATION, 1);
                // EaseOutCubic curve
                popOutProgress = 1 - Math.pow(1 - progress, 3);
                drawWheel();

                if (progress < 1) {
                    popOutAnimationId = requestAnimationFrame(animatePopOut);
                } else {
                    popOutProgress = 1;
                    drawWheel();
                    popOutAnimationId = null;
                    if (callback) callback();
                }
            }

            if (popOutAnimationId) cancelAnimationFrame(popOutAnimationId);
            popOutAnimationId = requestAnimationFrame(animatePopOut);
        }

        // --- Popups & Confetti ---
        function showWinPopup(winningItem) {
            isPopupClosing = false;
            const itemName = typeof winningItem === 'object' ? winningItem.name : String(winningItem);
            const remaining = typeof winningItem === 'object' ? winningItem.amount : null;
            winningItemText.textContent = itemName;
            if (winningItemRemainingText) {
                if (remaining === 0) {
                    winningItemRemainingText.textContent = '0 remaining (auto-removed from wheel)';
                } else if (typeof remaining === 'number') {
                    winningItemRemainingText.textContent = `${remaining} remaining`;
                } else {
                    winningItemRemainingText.textContent = '';
                }
            }
            if (removeWinnerButton) {
                removeWinnerButton.classList.toggle('hidden', !lastWinningItemId || remaining === 0);
            }
            winPopup.classList.remove('hidden');
            void winPopup.offsetWidth; // Force layout reflow for CSS transition
            winPopup.classList.add('popup-enter-active');
            winPopup.classList.remove('popup-enter');
            closePopupButton.focus();
            startConfettiBurst();
        }

        function closeWinPopup() {
            if (isPopupClosing || winPopup.classList.contains('hidden')) return;
            isPopupClosing = true;
            winPopup.classList.add('popup-leave-active');
            winPopup.classList.remove('popup-enter-active');
            setTimeout(() => {
                winPopup.classList.add('hidden');
                winPopup.classList.remove('popup-leave-active');
                winPopup.classList.add('popup-enter');
                isPopupClosing = false;
                popOutProgress = 0;
                winningSegmentIndex = -1;
                spinSessionItems = null;
                if (popOutAnimationId) cancelAnimationFrame(popOutAnimationId);
                setSpinningState(false);
                saveItems(true);
                (spinButton.disabled ? menuToggleButton : spinButton).focus();
            }, 300);

            confettiBurstActive = false;
        }

        closePopupButton.addEventListener('click', closeWinPopup);

        removeWinnerButton.addEventListener('click', () => {
            if (lastWinningItemId) {
                const winner = items.find(item => item.id === lastWinningItemId);
                if (winner) {
                    winner.active = false;
                }
                lastWinningItemId = null;
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
                } catch (e) {
                    console.error("Error saving items to localStorage:", e);
                }
                renderItemsList();
            }
            closeWinPopup();
        });

        winPopup.addEventListener('click', (event) => {
            if (event.target === winPopup) {
                closeWinPopup();
            }
        });

        // --- Confetti Logic ---
        function resizeConfettiCanvas() {
            const dpr = window.devicePixelRatio || 1;
            confettiCanvas.width = Math.floor(window.innerWidth * dpr);
            confettiCanvas.height = Math.floor(window.innerHeight * dpr);
            confettiCanvas.style.width = window.innerWidth + 'px';
            confettiCanvas.style.height = window.innerHeight + 'px';
            confettiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function createConfettiParticle(isBurst = false) {
            const x = Math.random() * window.innerWidth;
            const y = -20;
            const size = Math.random() * 14 + 6;
            const speedY = isBurst ? (Math.random() * 3 + 2) : (Math.random() * 0.65 + 0.4);
            const speedX = isBurst ? (Math.random() * 8 - 4) : ((Math.random() - 0.5) * 0.5);
            const rotation = Math.random() * 360;
            const rotationSpeed = isBurst ? (Math.random() * 10 - 5) : ((Math.random() - 0.5) * 1.5);
            const opacityDecay = isBurst ? 0.004 : 0.0012;

            // 1 in 1,000 (0.1%) chance to be a crab emoji celebration particle
            if (Math.random() < 0.001) {
                return {
                    x, y,
                    size: size * 1.8,
                    text: '🦀',
                    shape: 'emoji',
                    speedY, speedX,
                    rotation, rotationSpeed,
                    opacity: 1,
                    opacityDecay
                };
            } else {
                const color = googleColorsFull[Math.floor(Math.random() * googleColorsFull.length)];
                return {
                    x, y, size, color,
                    shape: 'rect',
                    speedY, speedX,
                    rotation, rotationSpeed,
                    opacity: 1,
                    opacityDecay
                };
            }
        }

        function animateConfetti() {
            if (!confettiCtx || document.hidden) {
                confettiAnimationId = null;
                return;
            }
            confettiCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            // Iterate backwards to safely splice particles without skipping indices
            for (let i = confettiParticles.length - 1; i >= 0; i--) {
                const particle = confettiParticles[i];
                particle.y += particle.speedY;
                particle.x += particle.speedX;
                particle.rotation += particle.rotationSpeed;
                particle.opacity -= (particle.opacityDecay || 0.004);

                if (particle.y > window.innerHeight + particle.size || particle.opacity <= 0) {
                    confettiParticles.splice(i, 1);
                    continue;
                }

                confettiCtx.save();
                confettiCtx.translate(particle.x + particle.size / 2, particle.y + particle.size / 2);
                confettiCtx.rotate((particle.rotation * Math.PI) / 180);
                confettiCtx.globalAlpha = Math.max(0, particle.opacity);

                if (particle.shape === 'emoji') {
                    confettiCtx.font = `${particle.size}px sans-serif`;
                    confettiCtx.textAlign = 'center';
                    confettiCtx.textBaseline = 'middle';
                    confettiCtx.fillText(particle.text, 0, 0);
                } else {
                    confettiCtx.fillStyle = particle.color;
                    confettiCtx.fillRect(-particle.size / 2, -particle.size / 2, particle.size, particle.size * 1.4);
                }
                confettiCtx.restore();
            }

            // Spawn new particles according to celebration state
            if (confettiBurstActive) {
                if (Math.random() > 0.88 && confettiParticles.length < 220) {
                    confettiParticles.push(createConfettiParticle(true));
                }
            } else if (continuousConfettiActive) {
                if (Math.random() > 0.985 && confettiParticles.length < 14) {
                    confettiParticles.push(createConfettiParticle(false));
                }
            }

            if (confettiParticles.length > 0 || continuousConfettiActive || confettiBurstActive) {
                confettiAnimationId = requestAnimationFrame(animateConfetti);
            } else {
                confettiCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                confettiAnimationId = null;
            }
        }

        function startConfettiBurst() {
            resizeConfettiCanvas();
            confettiParticles = [];
            for (let i = 0; i < 90; i++) {
                confettiParticles.push(createConfettiParticle(true));
            }

            confettiBurstActive = true;
            continuousConfettiActive = true;

            if (!confettiAnimationId && !document.hidden) {
                animateConfetti();
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && !confettiAnimationId && (continuousConfettiActive || confettiBurstActive)) {
                animateConfetti();
            }
        });

        // --- Menu Panel Logic ---
        function toggleMenu(show) {
            menuOpen = show;
            menuPanel.classList.toggle('open', menuOpen);
            menuOverlay.classList.toggle('visible', menuOpen);
            menuToggleButton.setAttribute('aria-expanded', String(menuOpen));
            if (show) {
                newItemNameInput.focus();
            } else {
                menuToggleButton.focus();
            }
        }

        menuToggleButton.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMenu(true);
        });

        closeMenuButton.addEventListener('click', () => toggleMenu(false));
        menuOverlay.addEventListener('click', () => toggleMenu(false));

        // Global keyboard accessibility listener
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (!winPopup.classList.contains('hidden')) {
                    closeWinPopup();
                } else if (menuOpen) {
                    toggleMenu(false);
                }
            }
        });

        // --- Utility & Event Listeners ---
        function checkActiveItems() {
            const hasActiveItems = items.some(item => item.active && item.amount > 0);
            if (!isSpinning) {
                spinButton.disabled = !hasActiveItems;
                spinButton.classList.toggle('opacity-50', !hasActiveItems);
                spinButton.classList.toggle('cursor-not-allowed', !hasActiveItems);
            }
            noActiveItemsMessage.classList.toggle('hidden', hasActiveItems);
            if (toggleAllItemsButton) {
                const anyInactive = items.some(item => !item.active || item.amount <= 0);
                toggleAllItemsButton.textContent = (items.length > 0 && !anyInactive) ? 'Deselect All' : 'Select All';
                toggleAllItemsButton.disabled = items.length === 0;
                toggleAllItemsButton.classList.toggle('opacity-50', items.length === 0);
            }
        }

        let resizeDebounceTimeout;
        function onResize() {
            clearTimeout(resizeDebounceTimeout);
            resizeDebounceTimeout = setTimeout(() => {
                requestAnimationFrame(() => {
                    invalidateWheelLayout();
                    clearTextWrapCache();
                    resizeConfettiCanvas();
                    drawWheel();
                });
            }, 120);
        }
        window.addEventListener('resize', onResize);

        // Sync items and spin count if updated in another browser tab
        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY) {
                loadItems();
            } else if (e.key === SPIN_COUNT_STORAGE_KEY) {
                loadSpinCount();
            }
        });

        // Commit any in-progress inline edit if the user reloads or closes the page
        window.addEventListener('pagehide', () => {
            if (currentlyEditingItemId !== null) {
                const activeInput = itemListElement.querySelector('input[type="text"]');
                if (activeInput) {
                    handleSaveEdit(currentlyEditingItemId, activeInput.value);
                }
            }
            if (spinCountInput && document.activeElement === spinCountInput) {
                spinCount = normalizeSpinCount(spinCountInput.value);
                saveSpinCount();
            }
        });

        // --- Initial Load ---
        loadSpinCount();
        loadItems();
        resizeConfettiCanvas();
        animateConfetti();

        // --- Offline App Cache (Service Worker Registration) ---
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((err) => {
                    console.warn('Service worker registration skipped:', err);
                });
            });
        }

  </script>
